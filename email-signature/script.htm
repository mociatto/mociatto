<!-- ==========================================
     PRIMARY CONFIGURATION BLOCK
     Change values here to update everywhere:
     ========================================== -->
<style>
  :root {
    --primary-font: Helvetica, Arial, sans-serif;
    --accent-color: #ff5900; /* Accent color (Name, Badge, IRIS) */
    --text-color: #b0b0b0;   /* Main text color (Subtitles, description) */
  }

  /* Global typography & palette classes */
  .sig-font { 
    font-family: var(--primary-font, 'Segoe UI', Helvetica, Arial, sans-serif) !important; 
  }
  .sig-accent { 
    color: var(--accent-color, #ff5900) !important; 
  }
  .sig-bg-accent { 
    background-color: var(--accent-color, #ff5900) !important; 
  }
  .sig-text { 
    color: var(--text-color, #b0b0b0) !important; 
  }
</style>

<!-- ==========================================
     EMAIL SIGNATURE TABLE
     ========================================== -->
